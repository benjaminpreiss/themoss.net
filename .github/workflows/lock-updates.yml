# Call from a schedule/dispatch workflow in each consumer; never run centrally.
name: Propose locked dependency updates
on:
  workflow_call:
    inputs:
      update-command:
        description: 'Consumer-owned lockfile update command (trusted default-branch workflow)'
        type: string
        required: true
      test-command:
        description: 'Consumer-owned build/test command'
        type: string
        required: true
      required-checks:
        description: 'Comma-separated exact required check names, also configured in branch protection'
        type: string
        required: true
    secrets:
      APP_ID:
        required: true
      APP_PRIVATE_KEY:
        required: true
jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/create-github-app-token@v2
        id: token
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.token.outputs.token }}
          persist-credentials: false
      - name: Update committed locks, then test before proposing
        env:
          UPDATE_COMMAND: ${{ inputs.update-command }}
          TEST_COMMAND: ${{ inputs.test-command }}
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          set -euo pipefail
          bash -euo pipefail -c "$UPDATE_COMMAND"
          bash -euo pipefail -c "$TEST_COMMAND"
          git diff --exit-code -- .github/workflows/ || { echo 'workflow modifications forbidden' >&2; exit 1; }
          git add -- flake.lock Cargo.lock
          if git diff --cached --quiet; then echo 'No lockfile changes'; exit 0; fi
          git diff --exit-code -- . ':(exclude)flake.lock' ':(exclude)Cargo.lock' || { echo 'unexpected changes' >&2; exit 1; }
          git config user.name 'dependency-update[bot]'
          git config user.email 'dependency-update[bot]@users.noreply.github.com'
          git switch -c "dependency-updates/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git commit -m 'Update pinned dependencies'
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)" push origin HEAD
      - name: Open PR and request gated auto-merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          REQUIRED: ${{ inputs.required-checks }}
        run: |
          set -euo pipefail
          if [[ ! $(git log -1 --format=%s) == 'Update pinned dependencies' ]]; then exit 0; fi
          [[ -n $REQUIRED ]] || { echo 'required-checks must be nonempty' >&2; exit 1; }
          base=${{ github.event.repository.default_branch }}
          # Refuse auto-merge if branch protection cannot be read or the named
          # checks are not actually required. Ruleset-only repos need equivalent
          # explicit verification before using this workflow.
          configured=$(gh api "repos/$GITHUB_REPOSITORY/branches/$base/protection/required_status_checks" --jq '[.contexts[], (.checks[]?.context)] | unique | join(",")') || {
            echo 'Cannot verify branch protection; auto-merge refused' >&2; exit 1;
          }
          IFS=, read -ra checks <<< "$REQUIRED"
          for check in "${checks[@]}"; do
            [[ -n $check && ",$configured," == *",$check,"* ]] || { echo "Not required by branch protection: $check" >&2; exit 1; }
          done
          url=$(gh pr create --base "$base" --head "$(git branch --show-current)" --title 'Update pinned dependencies' --body 'Automated lockfile refresh. Review changed root-level OS dependencies and required CI before merge.')
          # GitHub queues auto-merge only if enabled. It waits for branch rules
          # and required checks; any failure leaves a PR for human diagnosis.
          gh pr merge "$url" --auto --squash
