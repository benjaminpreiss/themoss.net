name: Regenerate CLI reference
on:
  push:
    branches-ignore: [main]
permissions:
  contents: write
jobs:
  regenerate:
    # Only trusted same-repository pushes. Do not push to main or fork PR heads.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    concurrency:
      group: cli-docs-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Regenerate standalone CLI, JSON specs and Markdown
        run: nix develop --no-write-lock-file .#dev --command bash packages/cli/regenerate.sh
      - name: Commit generated artifacts when they change
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git add -- packages/cli/bin/moss packages/cli/bin/machine/deploy.sh packages/cli/bin/machine/bootstrap/remote.sh packages/github-app-audit/bin/audit-app.sh docs/cli-spec docs/cli-reference.md
          if git diff --cached --quiet; then
            echo 'Generated artifacts are already current.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate CLI docs and standalone scripts'
          git push origin "HEAD:refs/heads/$BRANCH"
