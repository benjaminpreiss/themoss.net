name: Toolkit checks
on: [push, pull_request]
jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/test.sh
      - run: bash -n packages/cli/internal/deploy.sh tests/test.sh
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31
      - name: Exercise consumer-style lock update and synthetic machine build
        run: bash tests/consumer-commands.sh
      - name: Evaluate toolkit and both consumer examples
        run: |
          nix flake show --no-write-lock-file
          for file in packages/cli/internal/update.nix examples/agentic.nix examples/thepeer.nix; do
            nix-instantiate --parse "$file" >/dev/null
          done
